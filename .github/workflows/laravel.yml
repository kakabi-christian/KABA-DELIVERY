name: CI-CD Camwater (Full Pipeline)

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  # --- PARTIE 1 : QUALITÉ, TESTS & SONARQUBE ---
  laravel-tests:
    name: "🛡️ Qualité & Tests (Backend)"
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: laravel_test
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: "📊 [LOG] Initialisation du Runner"
        run: |
          echo "=== ENVIRONNEMENT DE CONTEXTE ==="
          echo "🕒 Heure de démarrage : $(date)"
          echo "🆔 Commit SHA : ${{ github.sha }}"
          echo "🌿 Branche cible : ${{ github.ref_name }}"
          echo "👤 Déclencheur : ${{ github.actor }}"

      - name: "📦 Récupération du code"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "⚙️ Installation PHP 8.4"
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, mysql, bcmath
          coverage: xdebug

      - name: "📊 [LOG] Vérification des versions PHP & Outils"
        run: |
          php -v
          composer -V

      - name: "📥 Installation Dépendances (Composer)"
        working-directory: ./Backend
        run: |
          echo "🚀 Démarrage de l'installation Composer avec Autoloader optimisé..."
          composer install --no-ansi --no-interaction --optimize-autoloader --prefer-dist
          echo "✅ Contenu du dossier vendor généré avec succès."

      - name: "✨ Vérification Clean Code (Pint)"
        working-directory: ./Backend
        run: |
          echo "🧐 Analyse de style en cours avec Laravel Pint..."
          ./vendor/bin/pint --test
        continue-on-error: true

      - name: "🧪 Exécution des Tests"
        working-directory: ./Backend
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: laravel_test
          DB_USERNAME: root
        run: |
          echo "🔧 Configuration du fichier d'environnement de test..."
          cp .env.example .env
          php artisan key:generate
          echo "🏃 Lancement de la suite de tests PHPUnit/Pest..."
          php artisan test
          echo "✅ Fin de l'exécution des tests."

      - name: "🛡️ Scan SonarCloud"
        uses: sonarsource/sonarqube-scan-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # --- PARTIE 2 : BUILD FRONTEND ---
  frontend-build:
    name: "🌐 Build Frontend (React)"
    needs: laravel-tests
    runs-on: ubuntu-latest
    steps:
      - name: "📦 Récupération du code"
        uses: actions/checkout@v4

      - name: "⚙️ Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ./Frontend/package-lock.json

      - name: "📊 [LOG] Inspection environnement Node"
        run: |
          node -v
          npm -v

      - name: "🏗️ Build Vite"
        working-directory: ./Frontend
        run: |
          echo "📥 Installation des modules npm..."
          npm install
          echo "🛠️ Lancement du Build de production..."
          npm run build
          echo "📂 --- STRUCTURE ET CONTENU DU DOSSIER DIST ---"
          ls -la dist/

      - name: "📤 Archivage du Build"
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: Frontend/dist/

  # --- PARTIE 3 : DOCKER HUB ---
  docker-hub:
    name: "🐳 Build & Push Docker"
    needs: laravel-tests
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: "📦 Récupération du code"
        uses: actions/checkout@v4

      - name: "🚨 [LOG SANITY CHECK] Vérification de la présence des Secrets"
        run: |
          echo "=== CHECKING SECRETS AVAILABILITY ==="
          if [ -z "${{ secrets.DOCKERHUB_USERNAME }}" ]; then
            echo "❌ ERREUR CRITIQUE : Le secret DOCKERHUB_USERNAME est VIDE ou inexistant dans GitHub Settings !"
            exit 1
          else
            echo "✅ Le secret DOCKERHUB_USERNAME est bien détecté."
          fi
          
          if [ -z "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "❌ ERREUR CRITIQUE : Le secret DOCKERHUB_TOKEN est VIDE ou inexistant dans GitHub Settings !"
            exit 1
          else
            echo "✅ Le secret DOCKERHUB_TOKEN est bien détecté."
          fi

      - name: "🔑 Login Docker Hub"
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: "🚀 Build & Push"
        uses: docker/build-push-action@v5
        with:
          context: ./Backend
          file: ./Backend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/camwater-backend:latest,${{ secrets.DOCKERHUB_USERNAME }}/camwater-backend:${{ github.sha }}

